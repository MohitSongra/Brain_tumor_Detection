raw_dir: data/raw
processed_dir: data/processed
manifest_path: data/processed/manifest.csv
train_dir: data/train
validation_dir: data/validation
test_dir: data/test
saved_models_dir: models/saved
model_path: models/saved/best_model.keras
eda_dir: results/eda
training_dir: results/training
evaluation_dir: results/evaluation
gradcam_dir: results/gradcam
prediction_dir: results/prediction
task: binary
source_classes:
- glioma
- meningioma
- notumor
- pituitary
binary_mapping:
  notumor: 0
  no_tumor: 0
  'no': 0
  glioma: 1
  meningioma: 1
  pituitary: 1
  tumor: 1
  'yes': 1
image_size: 224
batch_size: 32
cpu_batch_size: 8
epochs: 20
fine_tune_epochs: 10
learning_rate: 0.001
fine_tune_learning_rate: 1.0e-05
dropout: 0.3
dense_units: 128
cnn_filters:
- 32
- 64
- 128
finetune_layers: 20
fine_tune: true
weights: imagenet
model_name: efficientnet
prediction_threshold: 0.5
validation_split: 0.2
unsplit_validation_split: 0.15
test_split: 0.15
random_seed: 42
phash_distance: 4
patient_metadata: null
patient_id_regex: null
augmentation:
  horizontal_flip: true
  rotation_degrees: 10
  zoom: 0.05
  translation: 0.05
  contrast: 0.1
early_stopping_patience: 5
reduce_lr_patience: 2
reduce_lr_factor: 0.2
min_learning_rate: 1.0e-07
class_weights: true
device: auto
intra_op_threads: 8
inter_op_threads: 2
parallel_calls: 2
prefetch_batches: 1
deterministic: true
benchmark_batches: 3
max_upload_mb: 20
